[build]
builder = "RAILPACK"
buildCommand = "bun install --frozen-lockfile && bun run typecheck:backend"

[deploy]
preDeployCommand = "bun run db:migrate"
startCommand = "bun run --cwd backend start:api"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
